<!doctype html>

<title>DinkHub — Find your court. Book your game.</title>
<meta name="description" content="DinkHub is a pickleball court rental marketplace for Marawi City, Lanao del Sur. Discover courts, send booking requests, and manage reservations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
if (window.location.protocol === 'file:') {
  document.documentElement.classList.add('file-launch');
  const style = document.createElement('style');
  style.textContent = [
    '.file-launch{min-height:100%;background:#f5f4f0;color:#242821;font-family:Arial,sans-serif}',
    '.file-launch body{box-sizing:border-box;min-height:100vh;margin:0;padding:24px;display:grid;place-items:center}',
    '.file-launch *{box-sizing:border-box}',
    '.file-launch .file-launch-card{width:min(100%,520px);padding:36px;border:1px solid #e6e2d8;border-radius:20px;background:#fff;box-shadow:0 16px 48px #24282112}',
    '.file-launch h1{margin:0 0 12px;font-size:26px}',
    '.file-launch p{margin:0 0 18px;line-height:1.6;color:#5d625a}',
    '.file-launch a{display:inline-block;padding:12px 18px;border-radius:10px;background:#253b2d;color:white;font-weight:700;text-decoration:none}',
    '.file-launch .file-launch-help{margin-top:22px;padding-top:18px;border-top:1px solid #eeeae2;font-size:14px}',
    '.file-launch code{padding:3px 6px;border-radius:5px;background:#f1f0eb;color:#242821}'
  ].join('');
  document.head.appendChild(style);
  document.addEventListener('DOMContentLoaded', function () {
    document.body.innerHTML = '<main class="file-launch-card"><h1>Opening DinkHub</h1><p>This page needs the local DinkHub server. Checking whether it is running...</p><a href="http://localhost:3000/">Open DinkHub</a><p class="file-launch-help">If the link does not open the system, start the server from the project folder with <code>npm start</code>, then refresh this page.</p></main>';
    fetch('http://localhost:3000/', { mode: 'no-cors', cache: 'no-store' })
      .then(function () { window.location.replace('http://localhost:3000/'); })
      .catch(function () {
        document.querySelector('.file-launch-card > p').textContent =
          'DinkHub cannot run from a file URL. Start its local server, then open the app using the button below.';
      });
  }, { once: true });
}
</script>
